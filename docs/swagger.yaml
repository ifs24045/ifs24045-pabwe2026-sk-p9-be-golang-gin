basePath: /
definitions:
  ai.GenerateRequest:
    properties:
      category:
        type: string
      include_web_search:
        type: boolean
      topic:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - topic
    type: object
  auth.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      password:
        maxLength: 72
        minLength: 6
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  auth.UpdateProfileRequest:
    properties:
      email:
        type: string
      password:
        maxLength: 72
        minLength: 6
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - username
    type: object
  post.PostRequest:
    properties:
      category:
        type: string
      content:
        type: string
      cover_image_path:
        type: string
      excerpt:
        type: string
      title:
        maxLength: 255
        type: string
    required:
    - content
    - title
    type: object
  response.Body:
    properties:
      data: {}
      message:
        type: string
      status:
        type: string
    type: object
host: localhost:8081
info:
  contact: {}
  description: 'REST API Delcom Blog: publikasi artikel multi-tier dan AI Blog Generator
    dengan integrasi Search Engine.'
  title: Delcom Blog API
  version: "1.0"
paths:
  /api/admin/posts:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Arsip seluruh artikel dari semua penulis (Admin)
      tags:
      - Admin
  /api/admin/users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Daftar seluruh pengguna beserta total artikel (Admin)
      tags:
      - Admin
  /api/admin/users/{id}/posts:
    get:
      parameters:
      - description: ID pengguna
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Artikel milik pengguna tertentu (Admin)
      tags:
      - Admin
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Kredensial
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      summary: Login dan terima token JWT
      tags:
      - Auth
  /api/auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Logout sesi aktif
      tags:
      - Auth
  /api/auth/profile:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Ambil profil pengguna yang sedang login
      tags:
      - Auth
    put:
      consumes:
      - application/json
      parameters:
      - description: Data profil
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Perbarui profil pengguna yang sedang login
      tags:
      - Auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Data registrasi
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Body'
      summary: Registrasi akun penulis baru
      tags:
      - Auth
  /api/posts:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Daftar artikel milik penulis
      tags:
      - Posts
    post:
      consumes:
      - application/json
      parameters:
      - description: Data artikel
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/post.PostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Buat artikel baru
      tags:
      - Posts
  /api/posts/{id}:
    delete:
      parameters:
      - description: ID artikel
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Hapus artikel milik penulis
      tags:
      - Posts
    get:
      parameters:
      - description: ID artikel
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Detail artikel milik penulis (untuk diedit)
      tags:
      - Posts
    put:
      consumes:
      - application/json
      parameters:
      - description: ID artikel
        in: path
        name: id
        required: true
        type: integer
      - description: Data artikel
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/post.PostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Perbarui artikel milik penulis
      tags:
      - Posts
  /api/posts/{id}/toggle-publish:
    patch:
      parameters:
      - description: ID artikel
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Ubah status Draf <-> Terbit
      tags:
      - Posts
  /api/posts/ai-generate:
    post:
      consumes:
      - application/json
      parameters:
      - description: Topik, kategori, dan opsi penelusuran web
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ai.GenerateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Hasilkan draf artikel dengan AI + Search Engine
      tags:
      - AI
  /api/posts/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Ringkasan statistik artikel penulis
      tags:
      - Posts
  /api/public/categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      summary: Daftar kategori artikel
      tags:
      - Public
  /api/public/posts:
    get:
      parameters:
      - description: Kata kunci
        in: query
        name: q
        type: string
      - description: Kategori
        in: query
        name: category
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      summary: Daftar artikel terbit (cari dan filter kategori)
      tags:
      - Public
  /api/public/posts/{slug}:
    get:
      parameters:
      - description: Slug artikel
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      summary: Detail artikel terbit berdasarkan slug
      tags:
      - Public
securityDefinitions:
  BearerAuth:
    description: 'Isi dengan format: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
